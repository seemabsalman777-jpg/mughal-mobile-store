<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mughal Mobile — Mobile, Laptop &amp; Computer Accessories</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#0A0C10; --bg-2:#0E1116; --card:#14171E; --card-2:#181C24;
    --blue:#2E7CF6; --blue-2:#1652C4; --cyan:#5DD8FF;
    --silver:#E7EAEE; --muted:#8A93A3; --line:#232833;
    --radius:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,.025), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(255,255,255,.02), transparent 40%);
    color:var(--silver);line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.01em;}
  .mono,.price{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .container{max-width:1200px;margin:0 auto;padding:0 24px;}

  .announce{background:var(--card);color:var(--cyan);text-align:center;font-size:.78rem;letter-spacing:.08em;padding:8px 0;text-transform:uppercase;border-bottom:1px solid var(--line);}

  .navbar{background:rgba(10,12,16,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;}
  .navbar .container{display:flex;align-items:center;justify-content:space-between;height:80px;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:52px;height:52px;flex-shrink:0;border-radius:8px;object-fit:cover;}
  .brand-text{font-family:'Rajdhani',sans-serif;font-size:1.3rem;font-weight:700;letter-spacing:.03em;color:var(--silver);line-height:1.1;}
  .brand-text small{display:block;font-family:'Inter';font-size:.6rem;letter-spacing:.18em;color:var(--blue);text-transform:uppercase;font-weight:600;margin-top:2px;}
  .nav-links{display:flex;gap:26px;font-size:.9rem;}
  .nav-links button{background:none;color:var(--muted);padding:4px 0;font-weight:500;transition:color .2s;}
  .nav-links button:hover,.nav-links button.active{color:var(--cyan);}
